<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraph Resume Builder Agent</title>
    
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { color: var(--primary); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        textarea { width: 100%; height: 150px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; resize: vertical; }
        button { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; width: 100%; }
        button:hover { background: #1d4ed8; }
        .hidden { display: none; }
        .loading { text-align: center; font-style: italic; color: #64748b; margin: 15px 0; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; background: #f1f5f9; padding: 12px; border-radius: 6px; }
        .checkbox-item input { width: 18px; height: 18px; cursor: pointer; }
        .output-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-top: 15px; max-height: 500px; overflow-y: auto; }
        .step-section { margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 25px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🚀 AI Resume Builder Agent</h1>
        
        <!-- STEP 1: Inputs -->
        <div id="step1-section">
            <div class="form-group">
                <label for="resume">Paste Your Resume:</label>
                <textarea id="resume" placeholder="Paste your markdown or plain text resume here..."></textarea>
            </div>
            <div class="form-group">
                <label for="jd">Paste Job Description (JD):</label>
                <textarea id="jd" placeholder="Paste target Job Description here..."></textarea>
            </div>
            <button onclick="runAnalyzer()">Run Analyzer & Get Advisor Options</button>
        </div>

        <div id="loading1" class="loading hidden">Analyzing resume and generating advisor recommendations...</div>

        <!-- STEP 2: Advisor Multi-Select -->
        <div id="step2-section" class="step-section hidden">
            <h3>Step 2: Review Analysis & Select Modifications</h3>
            <div id="analysis-output" class="output-box" style="margin-bottom: 20px;"></div>
            
            <label>Select Modifications You Want to Apply:</label>
            <div id="options-container" style="margin-bottom: 20px;"></div>
            <button onclick="runWriter()">Generate Tailored Resume</button>
        </div>

        <div id="loading2" class="loading hidden">Rewriting resume based on your selections...</div>

        <!-- STEP 3: Final Resume Output -->
        <div id="step3-section" class="step-section hidden">
            <h3>Step 3: Your Tailored Resume</h3>
            <div id="final-output" class="output-box"></div>
        </div>
    </div>

    <script>
        
        let currentSessionId = "";

        async function postRequest(url, payload) {
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                const detail = data.detail;
                throw new Error(
                    typeof detail === "string"
                        ? detail
                        : JSON.stringify(detail || data)
                );
            }

            return data;
        }


        // ======================================
        // STEP 1: ANALYZER + ADVISOR
        // ======================================

        async function runAnalyzer() {

            const resumeText = document.getElementById("resume").value.trim();
            const jdText = document.getElementById("jd").value.trim();

            if (!resumeText || !jdText) {
                alert("Please provide both resume and job description.");
                return;
            }

            const button = document.querySelector("#step1-section button");

            button.disabled = true;
            button.textContent = "Analyzing...";

            document.getElementById("loading1").classList.remove("hidden");

            // Reset previous results
            document.getElementById("step2-section").classList.add("hidden");
            document.getElementById("step3-section").classList.add("hidden");

            currentSessionId = "";

            try {

                const data = await postRequest("/api/analyze", {
                    resume_text: resumeText,
                    jd_text: jdText
                });

                console.log("Analyzer response:", data);

                // Store session ID for writer
                currentSessionId = data.session_id;

                // Display analysis
                document.getElementById("analysis-output").innerHTML =
                    DOMPurify.sanitize(marked.parse(data.analysis || ""));

                // Display advisor options
                const optionsContainer =
                    document.getElementById("options-container");

                optionsContainer.replaceChildren();

                data.advice_options.forEach(opt => {

                    const item = document.createElement("div");
                    item.className = "checkbox-item";

                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.id = opt.id;
                    checkbox.value = opt.id;
                    checkbox.checked = true;

                    const label = document.createElement("label");
                    label.htmlFor = opt.id;
                    label.style.margin = "0";
                    label.style.fontWeight = "normal";

                    const strong = document.createElement("strong");
                    strong.textContent = `[${opt.id}] `;

                    label.append(strong, document.createTextNode(opt.text));

                    item.append(checkbox, label);
                    optionsContainer.appendChild(item);
                });

                document.getElementById("step2-section")
                    .classList.remove("hidden");

                document.getElementById("step2-section")
                    .scrollIntoView({ behavior: "smooth" });

            } catch (error) {

                console.error("Analyzer error:", error);
                alert("Analysis failed: " + error.message);

            } finally {

                button.disabled = false;
                button.textContent = "Run Analyzer & Get Advisor Options";

                document.getElementById("loading1")
                    .classList.add("hidden");
            }
        }


        // ======================================
        // STEP 2: WRITER
        // ======================================

        async function runWriter() {

            if (!currentSessionId) {
                alert("Please run the analyzer first.");
                return;
            }

            const checkboxes = document.querySelectorAll(
                "#options-container input[type='checkbox']:checked"
            );

            const selectedModifications = Array.from(checkboxes)
                .map(cb => cb.value);

            if (selectedModifications.length === 0) {
                alert("Please select at least one modification.");
                return;
            }

            const button = document.querySelector(
                "#step2-section button"
            );

            button.disabled = true;
            button.textContent = "Generating Resume...";

            document.getElementById("loading2")
                .classList.remove("hidden");

            try {

                const data = await postRequest("/api/generate", {
                    session_id: currentSessionId,
                    selected_modifications: selectedModifications
                });

                console.log("Writer response:", data);

                // Render generated Markdown resume
                document.getElementById("final-output").innerHTML =
                    DOMPurify.sanitize(marked.parse(data.final_resume || ""));

                document.getElementById("step3-section")
                    .classList.remove("hidden");

                document.getElementById("step3-section")
                    .scrollIntoView({ behavior: "smooth" });

            } catch (error) {

                console.error("Writer error:", error);
                alert("Resume generation failed: " + error.message);

            } finally {

                button.disabled = false;
                button.textContent = "Generate Tailored Resume";

                document.getElementById("loading2")
                    .classList.add("hidden");
            }
        }

    </script>
</body>
</html>
